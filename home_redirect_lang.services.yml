services:

  # EventSubscriber
  Drupal\home_redirect_lang\EventSubscriber\HomepageCookieLanguageRedirection:
    autowire: true
    tags:
      - { name: event_subscriber }

  Drupal\home_redirect_lang\EventSubscriber\HomepageBrowserLanguageRedirection:
    autowire: true
    tags:
      - { name: event_subscriber }

  # Hooks
  Drupal\home_redirect_lang\Hook\PreprocessPageHook:
    class: Drupal\home_redirect_lang\Hook\PreprocessPageHook
    autowire: true

  Drupal\home_redirect_lang\Hook\LanguageSwitcherBlockViewAlterHook:
    class: Drupal\home_redirect_lang\Hook\LanguageSwitcherBlockViewAlterHook
    autowire: true

  # Backward compatible service ids.
  home_redirect_lang.event.language_redirection.cookie:
    alias: Drupal\home_redirect_lang\EventSubscriber\HomepageCookieLanguageRedirection

  home_redirect_lang.event.language_redirection.browser:
    alias: Drupal\home_redirect_lang\EventSubscriber\HomepageBrowserLanguageRedirection
